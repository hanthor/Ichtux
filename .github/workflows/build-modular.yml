name: Build and Publish Modular Components

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'containerfiles/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  # ============================================================================
  # Build individual tools from Phase 1 as separate tagged components
  # ============================================================================
  build-core-components:
    name: "Build Core Components"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component:
          - { name: 'binutils', version: '2.42', target: 'binutils-pass1' }
          - { name: 'gcc', version: '13.2.0', target: 'gcc-pass2' }
          - { name: 'glibc', version: '2.39', target: 'glibc-build' }
          - { name: 'bash', version: '5.2.21', target: 'bash-build' }
          - { name: 'coreutils', version: '9.4', target: 'coreutils-build' }
          - { name: 'wget', version: '1.21.4', target: 'wget-build' }
          - { name: 'tar', version: '1.35', target: 'tar-build' }
          - { name: 'make', version: '4.4.1', target: 'make-build' }
          - { name: 'grep', version: '3.11', target: 'grep-build' }
          - { name: 'sed', version: '4.9', target: 'sed-build' }
          - { name: 'gawk', version: '5.3.0', target: 'gawk-build' }
          - { name: 'bison', version: '3.8.2', target: 'bison-build' }
          - { name: 'xz', version: '5.4.6', target: 'xz-build' }
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/core/${{ matrix.component.name }}
          tags: |
            type=raw,value=${{ matrix.component.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containerfiles/phase1-toolchain/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ichtux.component.name=${{ matrix.component.name }}
            ichtux.component.version=${{ matrix.component.version }}
            ichtux.component.type=core-tool
          cache-from: type=gha,scope=core-${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.component.name }}
          target: ${{ matrix.component.target }}

  # ============================================================================
  # Build system components (kernel, systemd parts)
  # ============================================================================
  build-system-components:
    name: "Build System Components"
    runs-on: ubuntu-latest
    needs: [build-core-components]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component:
          - { name: 'linux-kernel', version: '6.7.0', file: 'phase2-base', target: 'kernel-build' }
          - { name: 'busybox', version: '1.36.1', file: 'phase2-base', target: 'busybox-build' }
          - { name: 'util-linux', version: '2.39.3', file: 'phase2-base', target: 'util-linux-build' }
          - { name: 'e2fsprogs', version: '1.47.0', file: 'phase2-base', target: 'e2fsprogs-build' }
          - { name: 'kmod', version: '31', file: 'phase2-base', target: 'kmod-build' }
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/system/${{ matrix.component.name }}
          tags: |
            type=raw,value=${{ matrix.component.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containerfiles/${{ matrix.component.file }}/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ichtux.component.name=${{ matrix.component.name }}
            ichtux.component.version=${{ matrix.component.version }}
            ichtux.component.type=system
          cache-from: type=gha,scope=system-${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=system-${{ matrix.component.name }}
          target: ${{ matrix.component.target }}
          build-args: |
            PHASE1_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/core/gcc:13.2.0

  # ============================================================================
  # Build graphics components
  # ============================================================================
  build-graphics-components:
    name: "Build Graphics Components"
    runs-on: ubuntu-latest
    needs: [build-core-components]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component:
          - { name: 'mesa', version: '24.0.0', target: 'mesa-build' }
          - { name: 'wayland', version: '1.22.0', target: 'wayland-build' }
          - { name: 'wayland-protocols', version: '1.33', target: 'wayland-protocols-build' }
          - { name: 'libdrm', version: '2.4.120', target: 'libdrm-build' }
          - { name: 'pixman', version: '0.43.2', target: 'pixman-build' }
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/graphics/${{ matrix.component.name }}
          tags: |
            type=raw,value=${{ matrix.component.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containerfiles/phase3-graphical/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ichtux.component.name=${{ matrix.component.name }}
            ichtux.component.version=${{ matrix.component.version }}
            ichtux.component.type=graphics
          cache-from: type=gha,scope=graphics-${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=graphics-${{ matrix.component.name }}
          target: ${{ matrix.component.target }}
          build-args: |
            PHASE1_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/core/gcc:13.2.0

  # ============================================================================
  # Build complete phase images (aggregates of components)
  # ============================================================================
  build-phase-aggregates:
    name: "Build Phase Aggregates"
    runs-on: ubuntu-latest
    needs: [build-core-components, build-system-components, build-graphics-components]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        phase:
          - { name: 'phase1-toolchain', version: '1.0.0', file: 'phase1-toolchain', target: 'toolchain' }
          - { name: 'phase2-base', version: '1.0.0', file: 'phase2-base', target: 'base-os' }
          - { name: 'phase3-graphical', version: '1.0.0', file: 'phase3-graphical', target: 'graphical-stack' }
          - { name: 'phase4-assembly', version: '1.0.0', file: 'phase4-assembly', target: 'final' }
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.phase.name }}
          tags: |
            type=raw,value=${{ matrix.phase.version }}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.phase.name }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containerfiles/${{ matrix.phase.file }}/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ichtux.phase=${{ matrix.phase.name }}
            ichtux.version=${{ matrix.phase.version }}
          cache-from: type=gha,scope=${{ matrix.phase.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.phase.name }}
          target: ${{ matrix.phase.target }}

      - name: Generate attestation
        if: matrix.phase.name == 'phase4-assembly'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.phase.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ============================================================================
  # Create component catalog
  # ============================================================================
  create-component-catalog:
    name: "Create Component Catalog"
    runs-on: ubuntu-latest
    needs: [build-core-components, build-system-components, build-graphics-components]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate component catalog
        run: |
          cat > component-catalog.md << 'EOF'
          # Ichtux Component Catalog
          
          Published modular components available at `ghcr.io/hanthor/ichtux/*`
          
          ## Core Tools (Phase 1)
          
          | Component | Version | Image |
          |-----------|---------|-------|
          | binutils | 2.42 | `ghcr.io/hanthor/ichtux/core/binutils:2.42` |
          | gcc | 13.2.0 | `ghcr.io/hanthor/ichtux/core/gcc:13.2.0` |
          | glibc | 2.39 | `ghcr.io/hanthor/ichtux/core/glibc:2.39` |
          | bash | 5.2.21 | `ghcr.io/hanthor/ichtux/core/bash:5.2.21` |
          | coreutils | 9.4 | `ghcr.io/hanthor/ichtux/core/coreutils:9.4` |
          | wget | 1.21.4 | `ghcr.io/hanthor/ichtux/core/wget:1.21.4` |
          | tar | 1.35 | `ghcr.io/hanthor/ichtux/core/tar:1.35` |
          | make | 4.4.1 | `ghcr.io/hanthor/ichtux/core/make:4.4.1` |
          | grep | 3.11 | `ghcr.io/hanthor/ichtux/core/grep:3.11` |
          | sed | 4.9 | `ghcr.io/hanthor/ichtux/core/sed:4.9` |
          | gawk | 5.3.0 | `ghcr.io/hanthor/ichtux/core/gawk:5.3.0` |
          | bison | 3.8.2 | `ghcr.io/hanthor/ichtux/core/bison:3.8.2` |
          | xz | 5.4.6 | `ghcr.io/hanthor/ichtux/core/xz:5.4.6` |
          
          ## System Components (Phase 2)
          
          | Component | Version | Image |
          |-----------|---------|-------|
          | linux-kernel | 6.7.0 | `ghcr.io/hanthor/ichtux/system/linux-kernel:6.7.0` |
          | busybox | 1.36.1 | `ghcr.io/hanthor/ichtux/system/busybox:1.36.1` |
          | util-linux | 2.39.3 | `ghcr.io/hanthor/ichtux/system/util-linux:2.39.3` |
          | e2fsprogs | 1.47.0 | `ghcr.io/hanthor/ichtux/system/e2fsprogs:1.47.0` |
          | kmod | 31 | `ghcr.io/hanthor/ichtux/system/kmod:31` |
          
          ## Graphics Components (Phase 3)
          
          | Component | Version | Image |
          |-----------|---------|-------|
          | mesa | 24.0.0 | `ghcr.io/hanthor/ichtux/graphics/mesa:24.0.0` |
          | wayland | 1.22.0 | `ghcr.io/hanthor/ichtux/graphics/wayland:1.22.0` |
          | wayland-protocols | 1.33 | `ghcr.io/hanthor/ichtux/graphics/wayland-protocols:1.33` |
          | libdrm | 2.4.120 | `ghcr.io/hanthor/ichtux/graphics/libdrm:2.4.120` |
          | pixman | 0.43.2 | `ghcr.io/hanthor/ichtux/graphics/pixman:0.43.2` |
          
          ## Phase Aggregates
          
          | Phase | Version | Image |
          |-------|---------|-------|
          | Phase 1: Toolchain | 1.0.0 | `ghcr.io/hanthor/ichtux/phase1-toolchain:1.0.0` |
          | Phase 2: Base OS | 1.0.0 | `ghcr.io/hanthor/ichtux/phase2-base:1.0.0` |
          | Phase 3: Graphical | 1.0.0 | `ghcr.io/hanthor/ichtux/phase3-graphical:1.0.0` |
          | Phase 4: Assembly | 1.0.0 | `ghcr.io/hanthor/ichtux/phase4-assembly:1.0.0` |
          
          ## Usage Examples
          
          ### Using Individual Components
          
          ```dockerfile
          # Use specific version of wget
          FROM ghcr.io/hanthor/ichtux/core/wget:1.21.4 AS wget
          
          # Use in your custom image
          FROM scratch
          COPY --from=wget /tools /tools
          ```
          
          ### Assembling Custom System
          
          ```dockerfile
          # Mix and match components
          FROM ghcr.io/hanthor/ichtux/core/gcc:13.2.0 AS gcc
          FROM ghcr.io/hanthor/ichtux/core/bash:5.2.21 AS bash
          FROM ghcr.io/hanthor/ichtux/system/linux-kernel:6.7.0 AS kernel
          
          FROM scratch
          COPY --from=gcc /tools/bin/gcc /usr/bin/
          COPY --from=bash /tools/bin/bash /bin/
          COPY --from=kernel /rootfs/boot /boot
          ```
          
          ### Version Pinning
          
          ```bash
          # Pull specific versions
          docker pull ghcr.io/hanthor/ichtux/core/wget:1.21.4
          docker pull ghcr.io/hanthor/ichtux/graphics/mesa:24.0.0
          
          # Or use latest
          docker pull ghcr.io/hanthor/ichtux/core/wget:latest
          ```
          
          ## Renovate Integration
          
          All component versions are tracked by Renovate. When upstream releases occur, 
          Renovate will automatically create PRs to update versions.
          
          ## Build Info
          
          - Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - Commit: ${{ github.sha }}
          - Workflow: ${{ github.run_id }}
          
          EOF

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: component-catalog
          path: component-catalog.md

  # ============================================================================
  # Summary
  # ============================================================================
  build-summary:
    name: "Build Summary"
    runs-on: ubuntu-latest
    needs: [build-core-components, build-system-components, build-graphics-components, build-phase-aggregates]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# 🎉 Ichtux Modular Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Published Components" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Core Tools" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/hanthor/ichtux/core/gcc:13.2.0\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/hanthor/ichtux/core/bash:5.2.21\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/hanthor/ichtux/core/wget:1.21.4\`" >> $GITHUB_STEP_SUMMARY
          echo "- And 10+ more tools..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### System Components" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/hanthor/ichtux/system/linux-kernel:6.7.0\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/hanthor/ichtux/system/busybox:1.36.1\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Graphics Components" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/hanthor/ichtux/graphics/mesa:24.0.0\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/hanthor/ichtux/graphics/wayland:1.22.0\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Usage" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Pull specific component" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/hanthor/ichtux/core/wget:1.21.4" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Pull complete phase" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/hanthor/ichtux/phase4-assembly:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
