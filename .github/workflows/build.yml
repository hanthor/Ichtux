name: Build Ichtux Distribution

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'containerfiles/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
  schedule:
    # Weekly builds to incorporate security updates
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test phase'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Phase 1: Build Bootstrap Toolchain
  # ============================================================================
  build-phase1-toolchain:
    name: "Phase 1: Bootstrap Toolchain"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/phase1-toolchain
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Ichtux Phase 1 Toolchain
            org.opencontainers.image.description=Bootstrap toolchain built from scratch
            ichtux.phase=1-toolchain

      - name: Build and push Phase 1
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containerfiles/phase1-toolchain/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=phase1-toolchain
          cache-to: type=gha,mode=max,scope=phase1-toolchain
          target: toolchain
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/phase1-toolchain:${{ github.sha }}
          format: spdx-json
          output-file: sbom-phase1.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-phase1
          path: sbom-phase1.spdx.json

  # ============================================================================
  # Phase 2: Build Base OS
  # ============================================================================
  build-phase2-base:
    name: "Phase 2: Base OS"
    runs-on: ubuntu-latest
    needs: [build-phase1-toolchain]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/phase2-base
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Ichtux Phase 2 Base OS
            org.opencontainers.image.description=Base OS with kernel and systemd
            ichtux.phase=2-base

      - name: Build and push Phase 2
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containerfiles/phase2-base/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=phase2-base
          cache-to: type=gha,mode=max,scope=phase2-base
          target: base-os

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/phase2-base:${{ github.sha }}
          format: spdx-json
          output-file: sbom-phase2.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-phase2
          path: sbom-phase2.spdx.json

  # ============================================================================
  # Phase 3: Build Graphical Stack
  # ============================================================================
  build-phase3-graphical:
    name: "Phase 3: Graphical Stack"
    runs-on: ubuntu-latest
    needs: [build-phase1-toolchain, build-phase2-base]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/phase3-graphical
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Ichtux Phase 3 Graphical
            org.opencontainers.image.description=Graphics stack with Mesa, Wayland, GNOME
            ichtux.phase=3-graphical

      - name: Build and push Phase 3
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containerfiles/phase3-graphical/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=phase3-graphical
          cache-to: type=gha,mode=max,scope=phase3-graphical
          target: graphical-stack

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/phase3-graphical:${{ github.sha }}
          format: spdx-json
          output-file: sbom-phase3.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-phase3
          path: sbom-phase3.spdx.json

  # ============================================================================
  # Phase 4: Final Assembly
  # ============================================================================
  build-phase4-assembly:
    name: "Phase 4: Final Assembly"
    runs-on: ubuntu-latest
    needs: [build-phase1-toolchain, build-phase2-base, build-phase3-graphical]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Ichtux Linux
            org.opencontainers.image.description=Bootc-compatible Linux distribution built from scratch
            ichtux.phase=4-assembly
            bootc.compatible=true

      - name: Build and push Phase 4 (Final)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containerfiles/phase4-assembly/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=phase4-assembly
          cache-to: type=gha,mode=max,scope=phase4-assembly
          target: final

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-final.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-final
          path: sbom-final.spdx.json

  # ============================================================================
  # Test: Bootc Compatibility
  # ============================================================================
  test-bootc-compatibility:
    name: "Test: Bootc Compatibility"
    runs-on: ubuntu-latest
    needs: [build-phase4-assembly]
    if: github.event.inputs.skip_tests != 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull final image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify bootc metadata
        run: |
          echo "Checking bootc compatibility label..."
          BOOTC_COMPAT=$(docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} | \
            jq -r '.[0].Config.Labels."bootc.compatible"')
          if [ "$BOOTC_COMPAT" != "true" ]; then
            echo "❌ Error: Image is not marked as bootc-compatible"
            exit 1
          fi
          echo "✅ Image is bootc-compatible"

      - name: Verify OSTree bootable
        run: |
          echo "Checking ostree.bootable label..."
          OSTREE_BOOTABLE=$(docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} | \
            jq -r '.[0].Config.Labels."ostree.bootable"')
          if [ "$OSTREE_BOOTABLE" != "true" ]; then
            echo "❌ Error: Image is not marked as ostree-bootable"
            exit 1
          fi
          echo "✅ Image is ostree-bootable"

      - name: Test image layers
        run: |
          echo "Image layer information:"
          docker history ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} --no-trunc

      - name: Verify required packages
        run: |
          echo "Verifying essential packages..."
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            rpm -qa | grep -E "(gnome-shell|gdm|systemd|bootc)" || \
            (echo "❌ Missing required packages" && exit 1)
          echo "✅ All required packages present"

      - name: Test systemd functionality
        run: |
          echo "Testing systemd..."
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            systemctl --version || \
            (echo "❌ systemd not working" && exit 1)
          echo "✅ systemd functional"

  # ============================================================================
  # Generate Bootable Artifacts (ISO, QCOW2)
  # ============================================================================
  generate-bootable-iso:
    name: "Generate: Bootable ISO"
    runs-on: ubuntu-latest
    needs: [build-phase4-assembly, test-bootc-compatibility]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: read
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-utils

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate ISO using bootc-image-builder
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v $(pwd)/output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs ext4 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ichtux-linux-iso
          path: output/*.iso
          retention-days: 30

  # ============================================================================
  # Build Summary
  # ============================================================================
  build-summary:
    name: "Summary: Build Complete"
    runs-on: ubuntu-latest
    needs: [
      build-phase1-toolchain,
      build-phase2-base,
      build-phase3-graphical,
      build-phase4-assembly,
      test-bootc-compatibility
    ]
    if: always()
    steps:
      - name: Generate build summary
        run: |
          echo "# 🎉 Ichtux Linux Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build-phase1-toolchain.result }}" == "success" ]; then
            echo "✅ **Phase 1 (Toolchain)**: Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Phase 1 (Toolchain)**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-phase2-base.result }}" == "success" ]; then
            echo "✅ **Phase 2 (Base OS)**: Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Phase 2 (Base OS)**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-phase3-graphical.result }}" == "success" ]; then
            echo "✅ **Phase 3 (Graphical)**: Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Phase 3 (Graphical)**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-phase4-assembly.result }}" == "success" ]; then
            echo "✅ **Phase 4 (Assembly)**: Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Phase 4 (Assembly)**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.test-bootc-compatibility.result }}" == "success" ]; then
            echo "✅ **Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Tests**: Skipped or Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Image Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Quick Start" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull the image:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Convert to bootable disk:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "sudo bootc install to-disk \\" >> $GITHUB_STEP_SUMMARY
          echo "  --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \\" >> $GITHUB_STEP_SUMMARY
          echo "  /dev/sdX" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generate ISO:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "sudo podman run --rm --privileged \\" >> $GITHUB_STEP_SUMMARY
          echo "  --security-opt label=type:unconfined_t \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v /var/lib/containers/storage:/var/lib/containers/storage \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v ./output:/output \\" >> $GITHUB_STEP_SUMMARY
          echo "  quay.io/centos-bootc/bootc-image-builder:latest \\" >> $GITHUB_STEP_SUMMARY
          echo "  --type iso \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
